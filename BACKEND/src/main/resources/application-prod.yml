spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

logging:
  level:
    com.library: INFO
    org.springframework: WARN
    org.hibernate: WARN

jwt:
  expiration: 86400000  # 24 hours

server:
  port: ${PORT:8080}
  compression:
    enabled: true
