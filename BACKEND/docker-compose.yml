services:
  mysql:
    image: mysql:8.0
    container_name: mysql-library
    restart: unless-stopped
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: 19871983
      MYSQL_DATABASE: library_management_system
    ports:
      - "3307:3306"
    volumes:
      - library-mysql-data:/var/lib/mysql
      - ./database/library_management_system.sql:/docker-entrypoint-initdb.d/01-library_management_system.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p19871983"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: redis-library
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    container_name: backend-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/library_management_system
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 19871983
      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:
  library-mysql-data:
